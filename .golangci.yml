version: "2"

linters:
  default: standard
  enable:
    - misspell
  settings:
    misspell:
      # "overriden" is the (misspelled) field name the Odigos server returns on
      # the wire, so the `json:"overriden"` tag in types must match it verbatim.
      ignore-rules:
        - overriden
  exclusions:
    # Files generated by tools/gen-graphql carry the canonical
    # "// Code generated ... DO NOT EDIT." header, so `strict` detection skips
    # them. They can't be hand-fixed; any finding must be fixed in the
    # generator. Set to `disable` if you want to lint generated code too.
    generated: strict
    paths:
      - third_party$
      - builtin$
      - examples$
