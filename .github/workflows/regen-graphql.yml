name: Regenerate GraphQL operations

on:
  repository_dispatch:
    types: [enterprise-graphql-updated]
  workflow_dispatch:
    inputs:
      enterprise_ref:
        description: odigos-enterprise ref to generate from
        default: main
  # schedule:
  #   - cron: '0 6 * * *' # nightly safety net; no-op when nothing changed

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central-client
        uses: actions/checkout@v6

      - name: Checkout odigos-enterprise (graphql subtree only)
        uses: actions/checkout@v6
        with:
          repository: odigos-io/odigos-enterprise
          ref: ${{ github.event.client_payload.sha || inputs.enterprise_ref || 'main' }}
          token: ${{ secrets.ENTERPRISE_READ_TOKEN }}
          path: _enterprise
          sparse-checkout: central-ui/src/graphql

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Regenerate
        run: |
          go run ./tools/gen-graphql \
            -source _enterprise/central-ui/src/graphql \
            -out ./operations

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- operations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity check generated code
        if: steps.diff.outputs.changed == 'true'
        run: |
          go build ./...
          go test ./...

      - name: Open PR only if the generated files changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CENTRAL_CLIENT_PR_TOKEN }}
          add-paths: operations/*.go
          branch: chore/regen-graphql
          delete-branch: true
          title: 'chore: regenerate GraphQL operations from odigos-enterprise'
          commit-message: 'chore: regenerate GraphQL operations from odigos-enterprise'
          body: |
            Automated regeneration triggered by odigos-enterprise
            (`${{ github.event.client_payload.sha || inputs.enterprise_ref || 'scheduled' }}`).

            Generated by `tools/gen-graphql` from
            `central-ui/src/graphql/{queries,mutations}/**/*.ts`.

            Review notes:
            - If a new variant adds additive fields, add pointer fields to the
              appropriate struct in `types/`.
            - If a field's shape changes, bump the library minor version and
              update `CHANGELOG.md`.
